name: Build MindForge Hypnosis OS v2 APK

on:
  push:
    branches: ['self-hypnosis-app']
    paths:
      - 'MindForgeHypnosisOS/**'
      - '.github/workflows/build-mindforge-hypnosis-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: MindForgeHypnosisOS
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          cp MindForgeHypnosisOS/app/build/outputs/apk/release/app-release.apk MindForge-HypnosisOS-v2.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose MindForge-HypnosisOS-v2.0.0.apk
          sha256sum MindForge-HypnosisOS-v2.0.0.apk > MindForge-HypnosisOS-v2.0.0.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MindForge-HypnosisOS-v2-installable
          path: |
            MindForge-HypnosisOS-v2.0.0.apk
            MindForge-HypnosisOS-v2.0.0.sha256
          retention-days: 14
