name: Build Frequency Remapper APK

on:
  push:
    branches:
      - frequency-remapper-apk
  pull_request:
    branches:
      - ultracarrier-apk-build
  workflow_dispatch:

concurrency:
  group: frequency-remapper-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: .signing/frequency-remapper.jks
          key: frequency-remapper-signing-v1

      - name: Prepare corrected Vocals Front patch
        shell: bash
        run: python3 FrequencyRemapper/prepare_vocal_front_patch.py

      - name: Apply Vocals Front source patch
        shell: bash
        run: python3 FrequencyRemapper/apply_vocal_front_patch.py

      - name: Apply Combat Body Map source patch
        shell: bash
        run: python3 FrequencyRemapper/apply_combat_body_map_patch.py

      - name: Build release APK
        id: gradle_build
        working-directory: FrequencyRemapper
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace > ../frequency-remapper-build.log 2>&1
          status=$?
          grep -E "^(e:|.*error:|FAILURE:|\\* What went wrong:|> Task .* FAILED)" ../frequency-remapper-build.log | tail -n 300 > ../frequency-remapper-errors.txt || true
          exit $status

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyRemapper-v1.6.2-build-diagnostics
          path: |
            frequency-remapper-build.log
            frequency-remapper-errors.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Sign APK with persistent key
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="FrequencyRemapper/app/build/outputs/apk/release/app-release-unsigned.apk"
          KS=".signing/frequency-remapper.jks"
          mkdir -p .signing
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -noprompt -keystore "$KS" -storepass frequencyremapper -keypass frequencyremapper -alias frequencyremapper -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Frequency Remapper, O=VHanma, C=US"
          fi
          "$BT/zipalign" -f -p 4 "$IN" FrequencyRemapper-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias frequencyremapper --ks-pass pass:frequencyremapper --key-pass pass:frequencyremapper --out FrequencyRemapper-v1.6.2.apk FrequencyRemapper-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs FrequencyRemapper-v1.6.2.apk
          sha256sum FrequencyRemapper-v1.6.2.apk > FrequencyRemapper-v1.6.2.sha256

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyRemapper-v1.6.2-combat-body-map-apk
          path: |
            FrequencyRemapper-v1.6.2.apk
            FrequencyRemapper-v1.6.2.sha256
          if-no-files-found: error
          retention-days: 14
