name: Build Frequency Remapper APK

on:
  push:
    branches:
      - frequency-remapper-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build release APK
        id: gradle_build
        working-directory: FrequencyRemapper
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace > ../frequency-remapper-build.log 2>&1
          status=$?
          grep -E "^(e:|.*error:|FAILURE:|\\* What went wrong:|> Task .* FAILED)" ../frequency-remapper-build.log | tail -n 300 > ../frequency-remapper-errors.txt || true
          exit $status

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyRemapper-build-diagnostics
          path: |
            frequency-remapper-build.log
            frequency-remapper-errors.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Sign APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="FrequencyRemapper/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$IN" FrequencyRemapper-aligned.apk
          keytool -genkeypair -noprompt -keystore frequency-remapper.jks -storepass frequencyremapper -keypass frequencyremapper -alias frequencyremapper -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Frequency Remapper, O=VHanma, C=US"
          "$BT/apksigner" sign --ks frequency-remapper.jks --ks-key-alias frequencyremapper --ks-pass pass:frequencyremapper --key-pass pass:frequencyremapper --out FrequencyRemapper-v1.0.apk FrequencyRemapper-aligned.apk
          "$BT/apksigner" verify --verbose FrequencyRemapper-v1.0.apk
          sha256sum FrequencyRemapper-v1.0.apk > FrequencyRemapper-v1.0.sha256

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyRemapper-installable-apk
          path: |
            FrequencyRemapper-v1.0.apk
            FrequencyRemapper-v1.0.sha256
          if-no-files-found: error
          retention-days: 14
