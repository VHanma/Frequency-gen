name: FrequencyScope APK
on:
  push:
    branches: [ build/frequencyscope-apk ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: frequencyscope
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleDebug --stacktrace
      - name: Package
        run: |
          mkdir -p artifact
          cp frequencyscope/app/build/outputs/apk/debug/app-debug.apk artifact/FrequencyScope-v2.0.apk
          sha256sum artifact/FrequencyScope-v2.0.apk > artifact/FrequencyScope-v2.0.apk.sha256
          zip -qr artifact/FrequencyScope-v2.0-source.zip frequencyscope
      - uses: actions/upload-artifact@v4
        with:
          name: FrequencyScope-v2.0-installable
          path: artifact/*
          if-no-files-found: error
