name: FrequencyScope APK
on:
  push:
    branches: [ build/frequencyscope-apk ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: frequencyscope
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Package
        run: |
          mkdir artifact
          cp frequencyscope/app/build/outputs/apk/debug/app-debug.apk artifact/FrequencyScope-v1.0.apk
          sha256sum artifact/FrequencyScope-v1.0.apk > artifact/FrequencyScope-v1.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with: { name: FrequencyScope-installable, path: artifact/* }
