name: Build EtherShip APK

on:
  push:
    branches:
      - ethership-apk-build
    paths:
      - "EtherShip/**"
      - ".github/workflows/build-ethership-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        working-directory: EtherShip
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: cp EtherShip/app/build/outputs/apk/debug/app-debug.apk EtherShip-v1.0.apk

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: EtherShip-installable-apk
          path: EtherShip-v1.0.apk
          if-no-files-found: error
          retention-days: 14
