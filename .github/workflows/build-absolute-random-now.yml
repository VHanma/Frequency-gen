name: Build Absolute Random Selector APK Now

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-absolute-random-now.yml']
  pull_request:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BUILD ABSOLUTE RANDOM]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out requested app branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'random-selector-app' }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build release APK
        working-directory: AbsoluteRandomSelector
        shell: bash
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="AbsoluteRandomSelector/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$IN" AbsoluteRandomSelector-aligned.apk
          keytool -genkeypair -noprompt -keystore absolute-random.jks -storepass absoluterandom -keypass absoluterandom -alias absoluterandom -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Absolute Random Selector, O=VHanma, C=US"
          "$BT/apksigner" sign --ks absolute-random.jks --ks-key-alias absoluterandom --ks-pass pass:absoluterandom --key-pass pass:absoluterandom --out AbsoluteRandomSelector-v1.0.apk AbsoluteRandomSelector-aligned.apk
          "$BT/apksigner" verify --verbose AbsoluteRandomSelector-v1.0.apk
          sha256sum AbsoluteRandomSelector-v1.0.apk > AbsoluteRandomSelector-v1.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsoluteRandomSelector-installable-apk
          path: |
            AbsoluteRandomSelector-v1.0.apk
            AbsoluteRandomSelector-v1.0.sha256
          retention-days: 14

      - name: Report build run
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 30 --repo "$GITHUB_REPOSITORY" --body "Absolute Random Selector APK build run: ${GITHUB_RUN_ID} • status: ${{ job.status }} • https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
