name: Pixel 1 Emulator APK

on:
  push:
    branches: [pixel1-emulator-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;27.3.13750724'

      - name: Fetch VM engine
        shell: bash
        run: |
          git clone --depth 1 https://github.com/xoureldeen/Vectras-VM-Android.git pixel1vm

      - name: Convert Vectras into crash-safe Pixel 1 Emulator
        shell: bash
        run: |
          cd pixel1vm
          python3 - <<'PY'
          from pathlib import Path

          # Host app identity and stable Android 16 build target.
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("id 'com.google.gms.google-services'", "// PixelOne: google-services removed")
          s = s.replace("id 'com.google.firebase.crashlytics'", "// PixelOne: crashlytics plugin removed")
          s = s.replace('applicationId "com.vectras.vm"', 'applicationId "com.vaan.pixelonevm"')
          s = s.replace('versionName "4.4.9"', 'versionName "1.0.1-pixel1-fixed"')
          s = s.replace('compileSdk = 37', 'compileSdk = 36')
          s = s.replace("buildToolsVersion '36.1.0'", "buildToolsVersion '36.0.0'")

          # Remove Firebase runtime SDKs entirely. The previous build removed the
          # Gradle plugins but still executed Crashlytics from Application.onCreate,
          # which can terminate the process before the first Activity is visible.
          for dep in [
              '    implementation platform(libs.firebase.bom)\n',
              '    implementation libs.firebase.analytics\n',
              '    implementation libs.firebase.crashlytics\n',
              '    implementation libs.firebase.messaging\n',
          ]:
              s = s.replace(dep, '')
          p.write_text(s)

          # Keep all local Android modules on API 36.
          for gradle in Path('.').rglob('build.gradle'):
              text = gradle.read_text(errors='ignore')
              new = text.replace('compileSdkVersion 37', 'compileSdkVersion 36')
              if new != text:
                  gradle.write_text(new)

          # API-36-compatible dependency line.
          p = Path('gradle/libs.versions.toml')
          s = p.read_text()
          s = s.replace('coreKtx = "1.19.0"', 'coreKtx = "1.17.0"')
          s = s.replace('glide = "5.0.9"', 'glide = "5.0.7"')
          p.write_text(s)

          # Correct upstream Gradle wrapper checksum.
          p = Path('gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          s = s.replace(
              'bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01',
              '9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14'
          )
          p.write_text(s)

          # Strip Firebase calls from Application startup.
          p = Path('app/src/main/java/com/vectras/vm/VectrasApp.java')
          s = p.read_text()
          s = s.replace('import com.google.firebase.analytics.FirebaseAnalytics;\n', '')
          s = s.replace('import com.google.firebase.crashlytics.FirebaseCrashlytics;\n', '')
          s = s.replace('import com.vectras.vm.utils.GmsChecker;\n', '')
          firebase_block = '''        FirebaseCrashlytics.getInstance().log("App started: " + AppConfig.vectrasVersion);\n\n        if (GmsChecker.isAvailable(this)) {\n            AppConfig.isGmsAvailable = true;\n            FirebaseAnalytics.getInstance(this).logEvent(FirebaseAnalytics.Event.APP_OPEN, null);\n        } else {\n            FirebaseCrashlytics.getInstance().log("Device does not support GMS.");\n        }\n'''
          s = s.replace(firebase_block, '        // PixelOne: offline startup; no Firebase initialization.\n')
          p.write_text(s)

          # Preserve the FCM API surface used by settings/MainActivity, but make it
          # a local no-op so no Firebase Messaging provider is required at runtime.
          Path('app/src/main/java/com/vectras/vm/fcm/FCMManager.java').write_text('''package com.vectras.vm.fcm;\n\npublic final class FCMManager {\n    private FCMManager() {}\n    public static void subscribe() {}\n    public static void unsubscribe() {}\n}\n''')

          Path('app/src/main/java/com/vectras/vm/fcm/FCMService.java').write_text('''package com.vectras.vm.fcm;\n\nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\nimport androidx.annotation.Nullable;\n\npublic class FCMService extends Service {\n    @Nullable\n    @Override\n    public IBinder onBind(Intent intent) { return null; }\n}\n''')

          # Harden splash initialization so a non-essential folder/cleanup failure
          # cannot take the whole process down on newer Android releases.
          p = Path('app/src/main/java/com/vectras/vm/SplashActivity.java')
          s = p.read_text()
          old = '''        new Thread(() -> {\n            setupFolders();\n            MainSettingsManager.setOrientationSetting(this, 1);\n            setupFiles();\n            cleanUp();\n            checkLastANR();\n            runOnUiThread(this::finishSplash);\n        }).start();\n'''
          new = '''        new Thread(() -> {\n            try {\n                setupFolders();\n                MainSettingsManager.setOrientationSetting(this, 1);\n                setupFiles();\n                cleanUp();\n                checkLastANR();\n            } catch (Throwable t) {\n                Log.e(TAG, "Non-fatal startup initialization failure", t);\n            }\n            runOnUiThread(() -> {\n                try {\n                    finishSplash();\n                } catch (Throwable t) {\n                    Log.e(TAG, "Setup routing failed; opening VM home", t);\n                    try { startActivity(new Intent(this, MainActivity.class)); } catch (Throwable ignored) {}\n                    finish();\n                }\n            });\n        }).start();\n'''
          s = s.replace(old, new)
          p.write_text(s)

          # Branding and Pixel 1 defaults.
          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = s.replace('<string name="app_name">Vectras VM</string>', '<string name="app_name">Pixel 1 Emulator</string>')
          s = s.replace('</resources>', '\n    <string name="pixel_one_profile" translatable="false">Pixel 1 · sailfish · Android 7.1.2 · 1080×1920 · 4 GB RAM · ARM64</string>\n</resources>')
          p.write_text(s)

          p = Path('app/src/main/java/com/vectras/qemu/Config.java')
          s = p.read_text().replace('public static final String APP_NAME = "Vectras Emulator";', 'public static final String APP_NAME = "Pixel 1 Emulator";')
          p.write_text(s)

          p = Path('app/src/main/java/com/vectras/qemu/MainSettingsManager.java')
          s = p.read_text().replace('return prefs.getString("vmArch", "X86_64");', 'return prefs.getString("vmArch", "ARM64");')
          p.write_text(s)

          p = Path('app/src/main/java/com/vectras/vm/creator/VMCreatorActivity.java')
          s = p.read_text().replace('current.memory = 512;', 'current.memory = 4096; // Pixel 1 profile')
          p.write_text(s)

          p = Path('settings.gradle')
          s = p.read_text().replace('rootProject.name = "Vectras VM"', 'rootProject.name = "Pixel 1 Emulator"')
          p.write_text(s)
          PY

          cat > PIXEL1_BUILD.txt <<'EOF'
          Pixel 1 Emulator v1.0.1 crash-fix
          Codename: sailfish
          Guest target: Android 7.1.2 / API 25
          Display target: 1080 x 1920
          RAM: 4096 MB
          CPU profile: ARM64, quad-core target
          Engine: QEMU/Vectras-derived Android VM engine

          Startup fixes:
          - removed Firebase/Crashlytics initialization and runtime SDKs
          - replaced push-notification hooks with local no-op stubs
          - hardened splash initialization against non-essential startup failures

          Host APK compiles against Android API 36. This is independent from
          the emulated guest Android version.

          This build does not redistribute Google's proprietary Pixel factory image.
          It accepts compatible Android guest disk images through the VM interface.

          VM engine source: https://github.com/xoureldeen/Vectras-VM-Android
          Vectras VM is licensed under GPL-2.0.
          EOF

      - name: Build APK
        shell: bash
        run: |
          cd pixel1vm
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK identity and Firebase removal
        shell: bash
        run: |
          APK=pixel1vm/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -p "$APK" classes.dex | strings | grep -q 'FirebaseCrashlytics'; then
            echo 'Unexpected FirebaseCrashlytics reference remains in main dex' >&2
            exit 1
          fi

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp pixel1vm/app/build/outputs/apk/debug/app-debug.apk out/Pixel1-Emulator-v1.0.1-crashfix.apk
          cp pixel1vm/PIXEL1_BUILD.txt out/PIXEL1_BUILD.txt
          sha256sum out/Pixel1-Emulator-v1.0.1-crashfix.apk > out/SHA256.txt

      - name: Upload Pixel 1 Emulator
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1-Emulator-APK-crashfix
          path: out/*
          if-no-files-found: error
