name: Pixel 1 Emulator APK

on:
  push:
    branches: [pixel1-emulator-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;27.3.13750724'

      - name: Fetch VM engine
        shell: bash
        run: |
          git clone --depth 1 https://github.com/xoureldeen/Vectras-VM-Android.git pixel1vm

      - name: Convert Vectras into Pixel 1 Emulator
        shell: bash
        run: |
          cd pixel1vm
          python3 - <<'PY'
          from pathlib import Path

          # App identity and host build target.
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("id 'com.google.gms.google-services'", "// PixelOne: google-services plugin removed")
          s = s.replace("id 'com.google.firebase.crashlytics'", "// PixelOne: crashlytics plugin removed")
          s = s.replace('applicationId "com.vectras.vm"', 'applicationId "com.vaan.pixelonevm"')
          s = s.replace('versionName "4.4.9"', 'versionName "1.0.0-pixel1"')
          s = s.replace('compileSdk = 37', 'compileSdk = 36')
          s = s.replace("buildToolsVersion '36.1.0'", "buildToolsVersion '36.0.0'")
          p.write_text(s)

          # Upstream currently points Gradle 9.6.1 at the older 9.6.0 hash.
          # Keep verification enabled and correct it to Gradle's published 9.6.1 SHA-256.
          p = Path('gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          s = s.replace(
              'bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01',
              '9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14'
          )
          p.write_text(s)

          # Branding.
          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = s.replace('<string name="app_name">Vectras VM</string>', '<string name="app_name">Pixel 1 Emulator</string>')
          p.write_text(s)

          p = Path('app/src/main/java/com/vectras/qemu/Config.java')
          s = p.read_text()
          s = s.replace('public static final String APP_NAME = "Vectras Emulator";', 'public static final String APP_NAME = "Pixel 1 Emulator";')
          p.write_text(s)

          # Pixel 1 was ARM64. Make ARM64 the VM default.
          p = Path('app/src/main/java/com/vectras/qemu/MainSettingsManager.java')
          s = p.read_text()
          s = s.replace('return prefs.getString("vmArch", "X86_64");', 'return prefs.getString("vmArch", "ARM64");')
          p.write_text(s)

          # Pixel 1 profile defaults.
          p = Path('app/src/main/java/com/vectras/vm/creator/VMCreatorActivity.java')
          s = p.read_text()
          s = s.replace('current.memory = 512;', 'current.memory = 4096; // Pixel 1 profile')
          p.write_text(s)

          # Profile marker.
          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = s.replace('</resources>', '\n    <string name="pixel_one_profile" translatable="false">Pixel 1 · sailfish · Android 7.1.2 · 1080×1920 · 4 GB RAM · ARM64</string>\n</resources>')
          p.write_text(s)

          p = Path('settings.gradle')
          s = p.read_text().replace('rootProject.name = "Vectras VM"', 'rootProject.name = "Pixel 1 Emulator"')
          p.write_text(s)
          PY

          cat > PIXEL1_BUILD.txt <<'EOF'
          Pixel 1 Emulator profile
          Codename: sailfish
          Guest target: Android 7.1.2 / API 25
          Display target: 1080 x 1920
          RAM: 4096 MB
          CPU profile: ARM64, quad-core target
          Engine: QEMU/Vectras-derived Android VM engine

          Host APK compiles against Android API 36. That is independent from
          the emulated guest Android version.

          This build does not redistribute Google's proprietary Pixel factory image.
          It accepts compatible Android guest disk images through the VM interface.
          EOF

      - name: Build APK
        shell: bash
        run: |
          cd pixel1vm
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp pixel1vm/app/build/outputs/apk/debug/app-debug.apk out/Pixel1-Emulator-v1.0-debug.apk
          cp pixel1vm/PIXEL1_BUILD.txt out/PIXEL1_BUILD.txt

      - name: Upload Pixel 1 Emulator
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1-Emulator-APK
          path: out/*
          if-no-files-found: error
