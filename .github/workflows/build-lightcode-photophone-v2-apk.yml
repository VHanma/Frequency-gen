name: Build LightCode Photophone Forge APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/lightcode-photophone-v2'
    paths:
      - 'lightcode-jar/photophone/**'
      - 'firmware/rp2040_photophone_v2/**'
      - '.github/workflows/build-lightcode-photophone-v2-apk.yml'
  pull_request:
    branches:
      - 'agent/lightcode-photophone'
      - main
    paths:
      - 'lightcode-jar/photophone/**'
      - 'firmware/rp2040_photophone_v2/**'
      - '.github/workflows/build-lightcode-photophone-v2-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lightcode-jar

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Forge debug APK
        id: forge_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :photophone:assembleDebug 2>&1 | tee forge-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > forge-build-exit.txt
          exit 0

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightCode-Photophone-Forge-build-log
          path: |
            lightcode-jar/forge-build.log
            lightcode-jar/forge-build-exit.txt
          if-no-files-found: error

      - name: Fail when compiler failed
        shell: bash
        run: |
          code=$(cat forge-build-exit.txt)
          if [ "$code" != "0" ]; then
            echo "Forge compilation failed with exit code $code"
            exit "$code"
          fi

      - name: Upload Forge APK
        uses: actions/upload-artifact@v4
        with:
          name: LightCode-Photophone-Forge-debug-apk
          path: lightcode-jar/photophone/build/outputs/apk/debug/photophone-debug.apk
          if-no-files-found: error
