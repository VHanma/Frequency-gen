name: Build PulseLux Sync APK

on:
  push:
    branches: [ pulselux-sync-apk ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PulseLux branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p PulseLux :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp PulseLux/app/build/outputs/apk/debug/app-debug.apk out/PulseLux-Sync-v1.0.0.apk
          sha256sum out/PulseLux-Sync-v1.0.0.apk > out/PulseLux-Sync-v1.0.0-SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseLux-Sync-v1.0.0
          path: out/*
          if-no-files-found: error
          retention-days: 30
