name: GhostShot APK

on:
  push:
    branches:
      - ghostshot-apk-build
    paths:
      - 'ghostshot/**'
      - '.github/workflows/ghostshot-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable debug APK
        run: gradle -p ghostshot --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp ghostshot/app/build/outputs/apk/debug/app-debug.apk GhostShotOmegaPlus-v1.4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostShotOmegaPlus-v1.4-APK
          path: GhostShotOmegaPlus-v1.4-debug.apk
          if-no-files-found: error
          retention-days: 14
