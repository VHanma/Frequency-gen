name: OmegaVoice APK temporary build

on:
  push:
    branches:
      - build/omegavoice-apk-v03

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source
        run: |
          mkdir -p omegavoice_src/android/app/src/main/java/com/omegavoice/app
          cat omegavoice_src/MainActivity.part1 omegavoice_src/MainActivity.part2 omegavoice_src/MainActivity.part3 > omegavoice_src/android/app/src/main/java/com/omegavoice/app/MainActivity.java
          test -s omegavoice_src/android/app/src/main/java/com/omegavoice/app/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed | head -80
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        working-directory: omegavoice_src/android
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace
      - name: Package result
        run: |
          mkdir -p artifact
          cp omegavoice_src/android/app/build/outputs/apk/debug/app-debug.apk artifact/OmegaVoice-Free-v0.3.0.apk
          sha256sum artifact/OmegaVoice-Free-v0.3.0.apk > artifact/OmegaVoice-Free-v0.3.0.apk.sha256
          cp omegavoice_src/android/gradlew artifact/
          cp omegavoice_src/android/gradlew.bat artifact/
          cp -R omegavoice_src/android/gradle artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: OmegaVoice-Free-v0.3.0
          path: artifact
          if-no-files-found: error
