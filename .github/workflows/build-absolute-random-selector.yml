name: Build Absolute Random Tarot Clone APK

on:
  push:
    branches: [random-selector-tarot-clone]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tarot clone branch
        uses: actions/checkout@v4
        with:
          ref: random-selector-tarot-clone

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build release APK
        working-directory: AbsoluteRandomSelector
        shell: bash
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="AbsoluteRandomSelector/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$IN" AbsoluteRandomTarot-aligned.apk
          keytool -genkeypair -noprompt -keystore absolute-random-tarot.jks -storepass absolutetarot -keypass absolutetarot -alias absolutetarot -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Absolute Random Tarot, O=VHanma, C=US"
          "$BT/apksigner" sign --ks absolute-random-tarot.jks --ks-key-alias absolutetarot --ks-pass pass:absolutetarot --key-pass pass:absolutetarot --out AbsoluteRandomTarot-v1.0.apk AbsoluteRandomTarot-aligned.apk
          "$BT/apksigner" verify --verbose AbsoluteRandomTarot-v1.0.apk
          sha256sum AbsoluteRandomTarot-v1.0.apk > AbsoluteRandomTarot-v1.0.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsoluteRandomTarot-installable-apk
          path: |
            AbsoluteRandomTarot-v1.0.apk
            AbsoluteRandomTarot-v1.0.sha256
          retention-days: 14
