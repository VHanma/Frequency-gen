name: Build Absolute Random Tarot Rival 3 APK

on:
  push:
    branches: [random-tarot-rival3-entropy]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Rival 3 entropy branch
        uses: actions/checkout@v4
        with:
          ref: random-tarot-rival3-entropy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build release APK
        working-directory: AbsoluteRandomSelector
        shell: bash
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="AbsoluteRandomSelector/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$IN" AbsoluteRandomTarotR3-aligned.apk
          keytool -genkeypair -noprompt -keystore absolute-random-tarot-r3.jks -storepass absoluter3 -keypass absoluter3 -alias absoluter3 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Absolute Random Tarot Rival 3, O=VHanma, C=US"
          "$BT/apksigner" sign --ks absolute-random-tarot-r3.jks --ks-key-alias absoluter3 --ks-pass pass:absoluter3 --key-pass pass:absoluter3 --out AbsoluteRandomTarot-Rival3-v1.1.apk AbsoluteRandomTarotR3-aligned.apk
          "$BT/apksigner" verify --verbose AbsoluteRandomTarot-Rival3-v1.1.apk
          sha256sum AbsoluteRandomTarot-Rival3-v1.1.apk > AbsoluteRandomTarot-Rival3-v1.1.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsoluteRandomTarot-Rival3-installable-apk
          path: |
            AbsoluteRandomTarot-Rival3-v1.1.apk
            AbsoluteRandomTarot-Rival3-v1.1.sha256
          retention-days: 14
