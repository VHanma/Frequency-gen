name: DirectTube Omega v1.3 Bulk Build

on:
  push:
    paths:
      - '.github/workflows/_temporary-directtube-v13-bulk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout v1.3 bulk r4 branch
        uses: actions/checkout@v4
        with:
          ref: directtube-omega-v1.3-bulk-r4

      - name: Restore Android sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DirectTubeOmega/app/src/main/java/com/rivalomega/directtube
          base64 -d DirectTubeOmega/MainActivity.java.gz.b64 | gzip -d > DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/MainActivity.java
          cat DirectTubeOmega/chunks/YouTubeTranscriptClient.java.part* > DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/YouTubeTranscriptClient.java
          python3 DirectTubeOmega/tools/patch_fullest.py
          SRC='DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/MainActivity.java'
          grep -qi 'Bulk transcribe' "$SRC"
          grep -qi 'Transcribe all' "$SRC"
          grep -qi 'Copy all' "$SRC"
          grep -qi 'Export all TXT' "$SRC"
          grep -q 'SiteTranscriptCompat.fetch' DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/YouTubeTranscriptClient.java
          grep -q 'versionName "1.3.0"' DirectTubeOmega/app/build.gradle
          echo 'BULK_UI_GATE_OK'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35 packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Verify full transcript engine benchmark
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          rm -rf /tmp/dt-smoke && mkdir -p /tmp/dt-smoke
          javac -encoding UTF-8 -cp "/tmp/json.jar:$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/dt-smoke \
            DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/YouTubeTranscriptClient.java \
            DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/SiteTranscriptCompat.java \
            DirectTubeOmega/tools/SiteCompatSmoke.java
          java -cp "/tmp/dt-smoke:/tmp/json.jar:$ANDROID_HOME/platforms/android-35/android.jar" \
            com.rivalomega.directtube.SiteCompatSmoke A7cfV5rwZdk | tee /tmp/java-smoke.txt
          grep -q 'JAVA_FULL_TRANSCRIPT_GATE_OK' /tmp/java-smoke.txt
          grep -q 'words=7538' /tmp/java-smoke.txt
          grep -q 'lastMs=3100040' /tmp/java-smoke.txt

      - name: Build debug APK
        working-directory: DirectTubeOmega
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and package outputs
        shell: bash
        run: |
          set -euo pipefail
          APK='DirectTubeOmega/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/DirectTubeOmega-v1.3-Bulk.apk
          sha256sum dist/DirectTubeOmega-v1.3-Bulk.apk > dist/DirectTubeOmega-v1.3-Bulk.apk.sha256
          cp /tmp/java-smoke.txt dist/DirectTubeOmega-v1.3-Bulk-engine-smoke.txt
          mkdir -p dist/source/com/rivalomega/directtube
          cp DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/{MainActivity.java,YouTubeTranscriptClient.java,SiteTranscriptCompat.java,TranscriptStore.java} dist/source/com/rivalomega/directtube/
          cp DirectTubeOmega/app/build.gradle dist/source/
          cp DirectTubeOmega/app/src/main/AndroidManifest.xml dist/source/
          cd dist && zip -qr DirectTubeOmega-v1.3-Bulk-source.zip source && rm -rf source

      - name: Upload v1.3 bulk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DirectTubeOmega-v1.3-Bulk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
