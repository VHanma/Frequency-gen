name: DirectTube Omega v1.3 Bulk Build

on:
  push:
    paths:
      - '.github/workflows/_temporary-directtube-v13-bulk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v1.3 bulk branch
        uses: actions/checkout@v4
        with:
          ref: directtube-omega-v1.3-bulk-r2

      - name: Restore MainActivity source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          p = Path('DirectTubeOmega/MainActivity.java.gz.b64')
          out = Path('DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/MainActivity.java')
          out.parent.mkdir(parents=True, exist_ok=True)
          s = re.sub(r'\s+', '', p.read_text())
          s += '=' * (-len(s) % 4)
          raw = base64.b64decode(s)
          out.write_bytes(gzip.decompress(raw))
          print('RESTORED', out, out.stat().st_size)
          PY

      - name: Verify bulk feature is present
        shell: bash
        run: |
          SRC='DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/MainActivity.java'
          grep -n -Ei 'bulk|transcribe all|copy all|export all|queue' "$SRC" | head -120
          grep -q '1.3.0' DirectTubeOmega/app/build.gradle
          grep -qi 'bulk' "$SRC"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: DirectTubeOmega
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and package outputs
        shell: bash
        run: |
          APK='DirectTubeOmega/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/DirectTubeOmega-v1.3-Bulk.apk
          sha256sum dist/DirectTubeOmega-v1.3-Bulk.apk > dist/DirectTubeOmega-v1.3-Bulk.apk.sha256
          cp DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/MainActivity.java dist/MainActivity-v1.3-Bulk.java
          cd DirectTubeOmega
          zip -qr ../dist/DirectTubeOmega-v1.3-Bulk-source.zip . -x 'app/build/*' '.gradle/*'

      - name: Upload v1.3 bulk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DirectTubeOmega-v1.3-Bulk
          path: dist/*
          if-no-files-found: error
