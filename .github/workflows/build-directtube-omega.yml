name: Build DirectTube Omega APK

on:
  push:
    branches: [ directtube-omega-build ]
    paths:
      - 'DirectTubeOmega/**'
      - '.github/workflows/build-directtube-omega.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble validated Java sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DirectTubeOmega/app/src/main/java/com/rivalomega/directtube
          cat DirectTubeOmega/chunks/MainActivity.java.part* > DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/MainActivity.java
          cat DirectTubeOmega/chunks/YouTubeTranscriptClient.java.part* > DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/YouTubeTranscriptClient.java
          cat > /tmp/source.sha256 <<'EOF'
          1d68e2569e25718b1e259a140058cf6c7b705b656dd465c6469d4809b31c4717  DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/MainActivity.java
          069e180f065801779f2164dcd68473e4979bca08f81f7a3648212b62a6a76feb  DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/YouTubeTranscriptClient.java
          656cf884497c6108ad40e2d9df5699939ce4d2bebd986608267587f88fac1fc9  DirectTubeOmega/app/src/main/java/com/rivalomega/directtube/TranscriptStore.java
          EOF
          sha256sum -c /tmp/source.sha256

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35 from runner SDK manager
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build installable debug APK
        shell: bash
        run: gradle --no-daemon -p DirectTubeOmega :app:assembleDebug

      - name: Verify APK and rename
        shell: bash
        run: |
          set -euo pipefail
          APK=DirectTubeOmega/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" DirectTubeOmega-v1.0-debug.apk
          sha256sum DirectTubeOmega-v1.0-debug.apk > DirectTubeOmega-v1.0-debug.apk.sha256
          unzip -t DirectTubeOmega-v1.0-debug.apk >/dev/null
          ls -lh DirectTubeOmega-v1.0-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectTubeOmega-v1.0-APK
          path: |
            DirectTubeOmega-v1.0-debug.apk
            DirectTubeOmega-v1.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
