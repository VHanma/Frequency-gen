name: Build A432 Matrix APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'A432Matrix/**'
      - '.github/workflows/build-a432-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 16 packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release APK
        working-directory: A432Matrix
        shell: bash
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="A432Matrix/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$IN" A432Matrix-aligned.apk
          keytool -genkeypair -noprompt -keystore a432matrix.jks -storepass a432matrix -keypass a432matrix -alias a432matrix -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=A432 Matrix, O=VHanma, C=US"
          "$BT/apksigner" sign --ks a432matrix.jks --ks-key-alias a432matrix --ks-pass pass:a432matrix --key-pass pass:a432matrix --out A432Matrix-v0.1.0.apk A432Matrix-aligned.apk
          "$BT/apksigner" verify --verbose A432Matrix-v0.1.0.apk
          sha256sum A432Matrix-v0.1.0.apk > A432Matrix-v0.1.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A432Matrix-installable-apk
          path: |
            A432Matrix-v0.1.0.apk
            A432Matrix-v0.1.0.sha256
          retention-days: 14
