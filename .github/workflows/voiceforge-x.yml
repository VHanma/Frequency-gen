name: Build VoiceForge X APK
on:
  push:
    branches: [voiceforge-x]
    paths:
      - 'VoiceForgeX/**'
      - '.github/workflows/voiceforge-x.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoiceForgeX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceForgeX-debug-apk
          path: VoiceForgeX/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
