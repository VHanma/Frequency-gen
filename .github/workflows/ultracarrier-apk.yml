name: Build UltraCarrier APK

on:
  push:
    branches:
      - ultracarrier-apk-build
      - world-beam-lab-build
      - world-beam-lab-no-file-cap
      - world-beam-lab-collective
      - collective-beam-lab-scalar-clone
      - omega-elf-lab-clone
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Report build start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 21 --repo "${GITHUB_REPOSITORY}" --body "Omega ELF CI STARTED • run ${GITHUB_RUN_ID} • commit ${GITHUB_SHA} • event ${GITHUB_EVENT_NAME}"

      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build unsigned release APK
        id: gradle_build
        working-directory: UltraCarrier
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace > ../gradle-build.log 2>&1
          status=$?
          grep -E "^(e:|.*error:|FAILURE:|\\* What went wrong:|> Task .* FAILED)" ../gradle-build.log | tail -n 250 > ../gradle-errors.txt || true
          exit $status

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UltraCarrier-build-diagnostics
          path: |
            gradle-build.log
            gradle-errors.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Align and explicitly sign APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="UltraCarrier/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="UltraCarrier-aligned.apk"
          FINAL="UltraCarrier.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"

          keytool -genkeypair -noprompt \
            -keystore install-key.jks \
            -storepass ultracarrier \
            -keypass ultracarrier \
            -alias ultracarrier \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=UltraCarrier Personal Build, OU=Android, O=VHanma, C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks install-key.jks \
            --ks-key-alias ultracarrier \
            --ks-pass pass:ultracarrier \
            --key-pass pass:ultracarrier \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" \
            "$ALIGNED"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          sha256sum "$FINAL" | tee UltraCarrier.sha256

      - name: Upload finished APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UltraCarrier-installable-apk
          path: |
            UltraCarrier.apk
            UltraCarrier.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Report Omega ELF build run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 21 --repo "${GITHUB_REPOSITORY}" --body "Omega ELF clone CI • run ${GITHUB_RUN_ID} • commit ${GITHUB_SHA} • event ${GITHUB_EVENT_NAME} • status ${{ job.status }}"
