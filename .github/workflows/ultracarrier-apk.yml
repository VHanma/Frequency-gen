name: Build UltraCarrier APK

on:
  push:
    branches:
      - ultracarrier-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build installable debug APK
        id: gradle_build
        working-directory: UltraCarrier
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > ../gradle-build.log 2>&1
          status=$?
          grep -E "^(e:|.*error:|FAILURE:|\\* What went wrong:|> Task .* FAILED)" ../gradle-build.log | tail -n 250 > ../gradle-errors.txt || true
          exit $status

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UltraCarrier-build-diagnostics
          path: |
            gradle-build.log
            gradle-errors.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        if: success()
        shell: bash
        run: cp UltraCarrier/app/build/outputs/apk/debug/app-debug.apk UltraCarrier.apk

      - name: Upload finished APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UltraCarrier-installable-apk
          path: UltraCarrier.apk
          if-no-files-found: error
          retention-days: 7
