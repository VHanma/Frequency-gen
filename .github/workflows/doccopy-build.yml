name: Build Doc Copy + Reader APK

on:
  workflow_dispatch:
  push:
    branches:
      - doc-copy-apk
    paths:
      - 'doccopy/**'
      - '.github/workflows/doccopy-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add simple reader screen to MainActivity
        run: |
          cat doccopy/build_support/reader_main_v12.patch.part1 \
              doccopy/build_support/reader_main_v12.patch.part2 \
              doccopy/build_support/reader_main_v12.patch.part3 \
              doccopy/build_support/reader_main_v12.patch.part4 \
              doccopy/build_support/reader_main_v12.patch.part5 > /tmp/reader_main_v12.patch
          patch -p1 < /tmp/reader_main_v12.patch
          grep -q 'AUDIOBOOK READER' doccopy/app/src/main/java/com/vaanhanma/doccopy/MainActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: doccopy
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp doccopy/app/build/outputs/apk/debug/app-debug.apk DocCopyReader-v1.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocCopyReader-v1.2.0-APK
          path: DocCopyReader-v1.2.0.apk
          if-no-files-found: error
