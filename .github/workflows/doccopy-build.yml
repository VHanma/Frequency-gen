name: Build Doc Copy All APK

on:
  workflow_dispatch:
  push:
    branches:
      - doc-copy-apk
    paths:
      - 'doccopy/**'
      - '.github/workflows/doccopy-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: doccopy
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp doccopy/app/build/outputs/apk/debug/app-debug.apk DocCopyAll-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocCopyAll-v1.0.0-APK
          path: DocCopyAll-v1.0.0.apk
          if-no-files-found: error
