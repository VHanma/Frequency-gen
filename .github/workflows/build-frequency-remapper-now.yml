name: Build Frequency Remapper APK Now

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BUILD FREQUENCY REMAPPER]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Frequency Remapper branch
        uses: actions/checkout@v4
        with:
          ref: frequency-remapper-apk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build release APK
        working-directory: FrequencyRemapper
        shell: bash
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="FrequencyRemapper/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$IN" FrequencyRemapper-aligned.apk
          keytool -genkeypair -noprompt -keystore frequency-remapper.jks -storepass frequencyremapper -keypass frequencyremapper -alias frequencyremapper -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Frequency Remapper, O=VHanma, C=US"
          "$BT/apksigner" sign --ks frequency-remapper.jks --ks-key-alias frequencyremapper --ks-pass pass:frequencyremapper --key-pass pass:frequencyremapper --out FrequencyRemapper-v1.0.apk FrequencyRemapper-aligned.apk
          "$BT/apksigner" verify --verbose FrequencyRemapper-v1.0.apk
          sha256sum FrequencyRemapper-v1.0.apk > FrequencyRemapper-v1.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyRemapper-installable-apk
          path: |
            FrequencyRemapper-v1.0.apk
            FrequencyRemapper-v1.0.sha256
          retention-days: 14

      - name: Report run to trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Frequency Remapper APK build run: ${GITHUB_RUN_ID} • status: ${{ job.status }} • https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
