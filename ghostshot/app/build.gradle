plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vhanma.ghostshot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vhanma.ghostshot'
        minSdk 30
        targetSdk 36
        versionCode 4
        versionName '1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
