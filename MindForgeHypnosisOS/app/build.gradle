plugins { id 'com.android.application' }

android {
    namespace 'com.vhanma.mindforge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vhanma.mindforge'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
